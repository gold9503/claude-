plugins {
    id "com.android.application"
}

// 저장소 루트의 웹앱 파일(index.html 등)을 APK assets/www 로 복사
def webOut = layout.buildDirectory.dir("generated/webassets")
def copyWeb = tasks.register("copyWeb", Copy) {
    from(rootProject.file("..")) {
        include "index.html", "style.css", "app.js", "courses.js", "manifest.webmanifest", "icons/**"
    }
    into(webOut.map { it.dir("www") })
}

def buildNumber = (System.getenv("VERSION_CODE") ?: "1").toInteger()

android {
    namespace "kr.gbgolf.weather"
    compileSdk 35

    defaultConfig {
        applicationId "kr.gbgolf.weather"
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        // 개인 설치용 고정 서명키. 같은 키로 서명해야 새 버전을 덮어 설치(업데이트)할 수 있습니다.
        release {
            storeFile file("release.keystore")
            storePassword "gbgolf2026"
            keyAlias "gbgolf"
            keyPassword "gbgolf2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main.assets.srcDir(webOut)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named("preBuild") { dependsOn(copyWeb) }

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
